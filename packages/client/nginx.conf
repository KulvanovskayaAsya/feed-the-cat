worker_processes 1;

events {
	worker_connections 1024;
}

http {
	server_names_hash_bucket_size  128;
    include mime.types;

    sendfile on;
	large_client_header_buffers 4 32k;

	gzip            on;
	gzip_buffers    16 8k;
	gzip_static     on;
	gzip_comp_level 5;
	gzip_min_length 500;
	gzip_proxied    any;
	gzip_types      text/plain application/xml application/x-javascript text/javascript text/css text/json;

	server {
        location ~* ^.+\.(css|js|png|mp3)$ {
            expires 31536000s;
			add_header Pragma public;
			add_header Cache-Control "max-age=31536000, public";
        }
    }

    server {
        listen 80;
        listen [::]:80;
        server_name game-shakers-feed-the-cat-38.ya-praktikum.tech www.game-shakers-feed-the-cat-38.ya-praktikum.tech;

		location / {
			return 301 https://$host$request_uri;
		}
    }

    server {
		listen 443 ssl;
		listen [::]:443 ssl;

		# new format for nginx >= 1.25.1 is
		http2 on;

		server_name game-shakers-feed-the-cat-38.ya-praktikum.tech www.game-shakers-feed-the-cat-38.ya-praktikum.tech;

		# TLS version 1.2 or 1.3: Older TLS versions have vulnerabilities.
		ssl_protocols TLSv1.2 TLSv1.3;

		# TLS ECDHE/DHE cipher suites: Provides forward secrecy.
		ssl_ecdh_curve secp384r1;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

		# OCSP stapling: For faster certificate revocation checks.
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8; # Google DNS server

		ssl_certificate /etc/ssl/certs/my-site.crt;
		ssl_certificate_key /etc/ssl/private/my-site.key;

		location / {
			proxy_pass         http://prakticum-server:3001;
			proxy_redirect     off;
			proxy_http_version 1.1;
			proxy_cache_bypass $http_upgrade;
			proxy_set_header   Upgrade $http_upgrade;
			proxy_set_header   Connection keep-alive;
			proxy_set_header   Host $host;
			proxy_set_header   X-Real-IP $remote_addr;
			proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header   X-Forwarded-Proto $scheme;
			proxy_set_header   X-Forwarded-Host $server_name;
			proxy_buffer_size           128k;
			proxy_buffers               4 256k;
			proxy_busy_buffers_size     256k;
		}
	}
}
